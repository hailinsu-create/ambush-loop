# Minimal free-runner CI for Ambush VS skeleton (headless isolated empty test).
# Does not merge to main; does not spend paid minutes beyond public GitHub Actions quota.
name: ambush-vs-isolated-test

on:
  push:
    paths:
      - "ambush_vs/**"
      - ".github/workflows/ambush-vs-isolated-test.yml"
  pull_request:
    paths:
      - "ambush_vs/**"
      - ".github/workflows/ambush-vs-isolated-test.yml"

jobs:
  empty-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          sudo unzip -o /tmp/godot.zip -d /usr/local/bin
          sudo chmod +x /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64
          /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 --version

      # Fresh checkout has no .godot/ class_name cache; W2 scripts use class_name.
      - name: Import Ambush VS project
        run: |
          set -euo pipefail
          /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path ambush_vs --import

      - name: Isolated empty test (expect 0)
        run: |
          set -euo pipefail
          chmod +x ambush_vs/scripts/run_isolated_test.sh
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 empty_test.gd

      - name: Isolated W2 sim tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w2_sim_test.gd

      - name: Isolated W2 D.3 counterex tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w2_counterex_test.gd

      - name: Isolated W2 aim tolerance G.1 (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w2_aim_tolerance_test.gd

      - name: Isolated W3 greybox tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w3_greybox_test.gd

      - name: Isolated W4 scout tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w4_scout_test.gd

      - name: Isolated W5 combat FX tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w5_combat_fx_test.gd

      - name: Isolated W6 review tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w6_review_test.gd

      - name: Isolated W7 combat tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w7_combat_test.gd

      - name: Isolated W8 controls tests (expect 0)
        run: |
          set -euo pipefail
          ambush_vs/scripts/run_isolated_test.sh /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 w8_controls_test.gd

      - name: Direct entry rejected (expect 91)
        run: |
          set -euo pipefail
          set +e
          /usr/local/bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path ambush_vs -s res://scripts/empty_test.gd
          code=$?
          set -e
          echo "direct_entry_exit=$code"
          test "$code" -eq 91
